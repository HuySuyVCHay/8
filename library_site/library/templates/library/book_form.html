{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
        {% if book %}
            <a class="btn gray" href="{% url 'library:book_detail' book.pk %}">Отмена</a>
        {% else %}
            <a class="btn gray" href="{% url 'library:book_list' %}">Отмена</a>
        {% endif %}
    </form>
{% endblock %}
