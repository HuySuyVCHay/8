<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Библиотека{% endblock %} · Мини-библиотека</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #222; }
        header { background: #3b5bdb; color: #fff; padding: 14px 24px; display: flex;
                 justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; margin-left: 16px; }
        header .logo { font-size: 20px; font-weight: bold; margin-left: 0; }
        main { max-width: 800px; margin: 24px auto; background: #fff; padding: 24px;
               border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        footer { text-align: center; color: #888; padding: 16px; font-size: 14px; }
        .book { border-bottom: 1px solid #eee; padding: 12px 0; }
        .book h3 { margin: 0 0 4px; }
        .book a { color: #3b5bdb; }
        .muted { color: #777; }
        .btn { display: inline-block; background: #3b5bdb; color: #fff; padding: 8px 16px;
               border-radius: 6px; text-decoration: none; border: none; cursor: pointer; font-size: 15px; }
        .btn.gray { background: #868e96; }
        form p { margin: 12px 0; }
        form label { display: block; font-weight: bold; margin-bottom: 4px; }
        form input, form textarea { width: 100%; padding: 8px; box-sizing: border-box;
               border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .errorlist { color: #c92a2a; margin: 4px 0; padding-left: 18px; }
    </style>
</head>
<body>
    {% include "header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>Мини-библиотека на Django · {% now "Y" %}</footer>
</body>
</html>
